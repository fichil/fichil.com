server {
    listen 80;
    listen [::]:80;
    server_name fichil.com www.fichil.com cn.fichil.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fichil.com www.fichil.com cn.fichil.com;

    root /srv/www/fichil/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/fichil.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fichil.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    if ($host = www.fichil.com) {
        return 308 https://fichil.com$request_uri;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=600" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
