        items:
          - title: "生产可靠性与性能"
            content: "沿日志、运行配置、数据库行为、依赖链路和资源限制定位故障，控制修改范围，并用真实边界验证结果。"
            badges: ["故障定位", "SQL 性能", "运行时"]
          - title: "DevOps 与交付工程"
            content: "让构建、CI、环境边界、发布证据和回滚路径可重复执行，同时不让自动化掩盖真实运行风险。"
            badges: ["CI/CD", "Docker", "发布安全"]
          - title: "企业物流系统集成"
            content: "在 WMS、TMS、YMS、SAP/ERP、承运商、计费与 OpenAPI 之间对齐身份、契约、状态、幂等、对账和失败处理。"
            badges: ["WMS/TMS/YMS", "SAP/ERP", "OpenAPI"]

      about:
        enable: true
        id: "about"
        title: "公开、可复核的工作方式"
        content: |-
          这个网站既是工程笔记，也是我公开展示工作方法的地方。每个值得记录的案例都从可观察现象开始，沿真实数据和运行链路定位，控制改动范围，并以验证结果结束。

          - **修改前先建立证据**：检查日志、进程参数、数据库状态、网络路径和可复现现象。
          - **保持改动小且可回退**：除非需求明确改变，否则保留现有契约和并行业务流程。
          - **在真实边界完成验证**：对账数据，覆盖重试与失败路径，构建发布产物，并核对线上版本。
          - **AI 辅助、规则门禁**：人负责定义交付规则并承担责任；范围严格受限的双语博客 PR 只有在受保护检查通过后才可自动合并，其他变更仍需人工审核。
        skills:
          enable: true
          title: "核心技术栈"
          items:
            - "Java / Spring / REST API"
            - "MySQL / SQL 排障"
            - "Linux / 运行时 / 网络"
            - "Docker / GitHub Actions"
            - "WMS / TMS / YMS / SAP 集成"
            - "Codex / AI 辅助工程"

      projects:
        enable: true
        id: "projects"
        title: "核心工程案例"
        intro: "以下案例只使用公开、可核验的工程事实，展示我如何定位、修改和验证复杂系统，不暴露客户身份和私有数据。"
        items:
          - kicker: "可靠性"
            title: "生产可靠性与性能"
            content: "生产统计全部显示为 0，但业务数据实际存在。请求链路把大量明细加载到 Java 内存中并超时，页面却把初始化的 0 显示成了真实结果。"
            scope:
              - "从页面状态、Java 查询和生产数据量追踪完整请求链路"
              - "把统计下推为数据库聚合，同时保持原接口契约不变"
            outcomes:
              - "通过只读检查对账新旧统计结果"
              - "让请求失败显式可见，不再伪装成有效的 0"
            featured:
              name: "阅读核心案例"
              link: "/zh-cn/blog/production-dashboard-aggregation/"
            proofLinks:
              - name: "运行环境漂移"
                link: "/zh-cn/blog/distributed-runtime-environment-drift/"
              - name: "容器连接故障"
                link: "/zh-cn/blog/dubbo-connection-refused-container/"
            badges: ["SQL", "性能", "生产"]
          - kicker: "开源"
            title: "AI 辅助开发与运维的 fichil.com"
            content: "这个站点本身就是一个开源交付系统：Hugo Markdown 保持为内容源，vinext 渲染 Sites 应用，通过门禁的变更经由 CI、精确 SHA 发布证据和版本回滚进入生产。"
            scope:
              - "双语内容和应用修改都在 Git 中保持可审查"
              - "人定义发布规则；受保护检查可自动合并范围严格受限的博客更新"
            outcomes:
              - "通过 /version.json 暴露当前线上提交"
              - "生产回滚使用上一已知正常的 Sites 版本"
            featured:
              name: "查看源码"
              link: "https://github.com/fichil/fichil.com"
            proofLinks:
              - name: "阅读交付架构"
                link: "/zh-cn/blog/ai-maintained-hugo-site/"
            badges: ["开源", "AI 辅助", "Sites"]
          - kicker: "集成"
            title: "企业物流系统集成"
            content: "WMS、TMS、YMS、SAP/ERP、承运商、计费、回单和 OpenAPI 的集成不只是连接接口，还必须统一身份、数据归属、状态、重试和对账规则。"
            scope:
              - "定义接口契约、身份边界、状态映射、幂等和错误语义"
              - "闭环入库、库存、出库、运输、计费、园区与外部 API 流程"
            outcomes:
              - "用数据库对账和全域 smoke 验证最终状态"
              - "不让不可控第三方决定平台内部流程是否正确"
            featured:
              name: "讨论集成需求"
              link: "/zh-cn/#contact"
            proofLinks:
              - name: "组织数据模型"
                link: "/zh-cn/blog/logistics-organization-data-model/"
              - name: "TMS 迁移矩阵"
                link: "/zh-cn/blog/legacy-tms-migration-matrix/"
              - name: "生产级 WMS RF"
                link: "/zh-cn/blog/production-grade-wms-rf/"
              - name: "数据库闭环验收"
                link: "/zh-cn/blog/database-backed-business-flow-acceptance/"
