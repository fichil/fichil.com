baseURL: "https://fichil.com/"
title: "Fichil | Backend, DevOps & Enterprise Integration"
theme: "hugo-profile"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true


pagination:
  pagerSize: 6

outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: "tags"
  category: "categories"

params:
  color:
    textColor: "#0B1720"
    secondaryTextColor: "#465D68"
    textLinkColor: "#006E68"
    backgroundColor: "#F4F7F8"
    secondaryBackgroundColor: "#E8EFF1"
    primaryColor: "#006E68"
    secondaryColor: "#FFFFFF"
    darkmode:
      textColor: "#EAF5F7"
      secondaryTextColor: "#9AB0BB"
      textLinkColor: "#62E6D2"
      backgroundColor: "#071019"
      secondaryBackgroundColor: "#162B38"
      primaryColor: "#62E6D2"
      secondaryColor: "#0E1E2A"
  useBootstrapCDN: false
  mathjax: false
  animate: true
  singlePages:
    socialShare: false
    tags:
      openInNewTab: false

languages:
  # ================= English site config =================
  en:
    languageName: "English"
    languageCode: "en-us"
    contentDir: "content/en"
    weight: 1
    title: "Fichil | Backend, DevOps & Integration Engineer"
    menus:
      main:
        - identifier: "about"
          name: "Services"
          url: "/#services"
          weight: 1
        - identifier: "projects"
          name: "Core Cases"
          url: "/#projects"
          weight: 2
        - identifier: "blog"
          name: "Blog"
          url: "/blog/"
          weight: 3
        - identifier: "contact"
          name: "Contact"
          url: "/#contact"
          weight: 4
    params:
      description: "Backend, DevOps, and enterprise integration engineer documenting production reliability, logistics systems, and evidence-led delivery."
      favicon: "/favicon.png"
      navbar:
        align: "ms-auto"
        disableSearch: true
        stickyNavBar:
          enable: true
          showOnScrollUp: true
        menus:
          disableAbout: true
          disableProjects: true
          disableContact: true

      hero:
        enable: true
        intro: "Fichil · Engineering Field Notes"
        title: "Trace the failure. Keep the evidence."
        subtitle: "Production systems, delivery pipelines, and enterprise integration—from symptom to verification."
        content: "Explore bilingual investigations grounded in logs, database state, tests, and release results. Each note explains what changed, why it changed, and how the real system boundary was verified."
        signal:
          eyebrow: "Live engineering system"
          title: "From system signal to exact release"
          releaseLabel: "Exact reviewed build"
          phases:
            - code: "OBSERVE"
              label: "Observe"
              detail: "Capture reproducible runtime signals."
            - code: "ISOLATE"
              label: "Isolate"
              detail: "Narrow the real failure boundary."
            - code: "VERIFY"
              label: "Verify"
              detail: "Confirm the repair with reviewable evidence."
            - code: "RELEASE"
              label: "Release"
              detail: "Deliver the exact reviewed commit."
        button:
          enable: true
          name: "Read the Latest Investigation"
          url: "/blog/"
          newPage: false
        secondaryButton:
          name: "Browse All Engineering Notes"
          url: "/blog/"
        bottomImage:
          enable: false

      trust:
        postsLabel: "bilingual engineering notes"
        sourceValue: "Open source"
        sourceLabel: "site repository"
        releaseValue: "CI + exact SHA"
        releaseLabel: "release evidence"

      services:
        title: "Problems I Can Help Close"
        intro: "Focused engineering support for systems that are difficult to diagnose, risky to change, or spread across several teams and services."
        items:
          - title: "Production Reliability & Performance"
            content: "Trace failures through logs, runtime configuration, database behavior, dependencies, and resource limits; make the smallest safe change and prove the result."
            badges: ["Incident Analysis", "SQL Performance", "Runtime"]
          - title: "DevOps & Delivery Engineering"
            content: "Make builds, CI checks, environment boundaries, release evidence, and rollback paths repeatable without hiding operational risk behind automation."
            badges: ["CI/CD", "Docker", "Release Safety"]
          - title: "Enterprise Logistics Integration"
            content: "Align identity, contracts, state transitions, idempotency, reconciliation, and failure handling across WMS, TMS, YMS, SAP/ERP, carriers, billing, and OpenAPI."
            badges: ["WMS/TMS/YMS", "SAP/ERP", "OpenAPI"]

      about:
        enable: true
        id: "about"
        title: "An Open, Reviewable Way of Working"
        content: |-
          I use this site as both an engineering notebook and a public record of how I work. Each useful case starts from observed behavior, follows the real data and runtime path, limits the change surface, and ends with verification.

          - **Evidence before edits**: logs, process arguments, database state, network paths, and reproducible failures.
          - **Small, reversible changes**: preserve existing contracts and parallel business flows unless the requirement explicitly changes them.
          - **Verification at the real boundary**: reconcile data, test retries and failures, build release artifacts, and confirm the deployed version.
          - **AI-assisted, policy-gated**: people define the delivery policy and remain accountable; narrowly scoped bilingual blog PRs may auto-merge only after protected checks, while other changes remain human-reviewed.
        skills:
          enable: true
          title: "Core Stack"
          items:
            - "Java / Spring / REST APIs"
            - "MySQL / SQL troubleshooting"
            - "Linux / Runtime / Networking"
            - "Docker / GitHub Actions"
            - "WMS / TMS / YMS / SAP integration"
            - "Codex / AI-assisted engineering"

      projects:
        enable: true
        id: "projects"
        title: "Selected Engineering Cases"
        intro: "Public, source-backed examples showing how I diagnose, change, and verify complex systems without exposing client identities or private data."
        items:
          - kicker: "Reliability"
            title: "Production Reliability & Performance"
            content: "A production dashboard showed zero while business data existed. The request path loaded large detail sets into Java, timed out, and left the UI's default value visible as if it were real data."
            scope:
              - "Trace the request from UI state through Java queries and production data volume"
              - "Move summary calculation into database aggregates without changing the API contract"
            outcomes:
              - "Reconciled old and new results with read-only checks"
              - "Made failures visible instead of presenting them as valid zeroes"
            featured:
              name: "Read Core Case"
              link: "/blog/production-dashboard-aggregation/"
            proofLinks:
              - name: "Runtime environment drift"
                link: "/blog/distributed-runtime-environment-drift/"
              - name: "Container connection failure"
                link: "/blog/dubbo-connection-refused-container/"
            badges: ["SQL", "Performance", "Production"]
          - kicker: "Open Source"
            title: "AI-Assisted fichil.com"
            content: "This site is an open-source delivery system: Hugo Markdown remains the content source, vinext renders the Sites application, and validated changes move through CI, exact-SHA release evidence, and version-based rollback."
            scope:
              - "Bilingual content and application changes remain reviewable in Git"
              - "People define release policy; protected checks can auto-merge narrowly scoped blog updates"
            outcomes:
              - "The deployed commit is exposed through /version.json"
              - "Production rollback uses a previously known-good Sites version"
            featured:
              name: "View Source"
              link: "https://github.com/fichil/fichil.com"
            proofLinks:
              - name: "Read the delivery architecture"
                link: "/blog/ai-maintained-hugo-site/"
            badges: ["Open Source", "AI-Assisted", "Sites"]
          - kicker: "Integration"
            title: "Enterprise Logistics Integration"
            content: "Integration work across WMS, TMS, YMS, SAP/ERP, carriers, billing, proof of delivery, and OpenAPI requires more than connecting endpoints: identity, ownership, state, retry, and reconciliation rules must agree."
            scope:
              - "Define contracts, ownership boundaries, state mappings, idempotency, and error semantics"
              - "Close inbound, inventory, outbound, transport, billing, yard, and external API flows"
            outcomes:
              - "Verify final state through database reconciliation and full-domain smoke scenarios"
              - "Keep unavailable third parties outside the platform's internal acceptance decision"
            featured:
              name: "Discuss an Integration"
              link: "/#contact"
            proofLinks:
              - name: "Organization data model"
                link: "/blog/logistics-organization-data-model/"
              - name: "TMS migration matrix"
                link: "/blog/legacy-tms-migration-matrix/"
              - name: "Production-grade WMS RF"
                link: "/blog/production-grade-wms-rf/"
              - name: "Database-backed acceptance"
                link: "/blog/database-backed-business-flow-acceptance/"
            badges: ["WMS/TMS/YMS", "SAP/ERP", "Reconciliation"]

      contact:
        enable: true
        id: "contact"
        title: "Describe the System, Not Just the Symptom"
        content: "For production troubleshooting, DevOps delivery work, or logistics integration, send the current behavior, expected result, affected environment, available logs or data samples, and any release constraint. I will respond from the evidence that is actually available."
        btnName: "Start with an Email"
        btnLink: "mailto:fichilzhang@gmail.com?subject=Engineering%20project%20brief"

