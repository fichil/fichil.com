baseURL: "https://fichil.com/"
title: "Fichil | Backend, DevOps & AI-Assisted Engineering"
theme: "hugo-profile"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true

pagination:
  pagerSize: 6

outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: "tags"
  category: "categories"

params:
  useBootstrapCDN: true # 开启 CDN 以优化全球访问速度
  mathjax: false
  animate: true

languages:
  # ================= 英文版配置 =================
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 1
    title: "Fichil | Backend, DevOps & Integration Engineer"
    menus:
      main:
        - identifier: "about"
          name: "Services"
          url: "#about"
          weight: 1
        - identifier: "projects"
          name: "Cases"
          url: "#projects"
          weight: 2
        - identifier: "blog"
          name: "Blog"
          url: "/blog"
          weight: 3
        - identifier: "contact"
          name: "Contact"
          url: "#contact"
          weight: 4
    params:
      description: "Backend engineer focused on Java, logistics systems, DevOps troubleshooting, open-source tools, and AI-assisted development."
      favicon: "/favicon.svg"
      navbar:
        align: "ms-auto"
        stickyNavBar:
          enable: true
          showOnScrollUp: true

      hero:
        enable: true
        intro: "Build. Debug. Ship."
        title: "I'm Fichil."
        subtitle: "Backend / DevOps / Enterprise Integration Engineer"
        content: "I document real engineering work across Java backend systems, logistics platforms, Nginx/Linux operations, SAP/WMS/TMS integrations, and AI-assisted development workflows."
        image: "/images/profile.png"
        button:
          enable: true
          name: "Read My Work"
          url: "/blog/"

      about:
        enable: true
        id: "about"
        title: "Engineering Focus"
        content: |-
          This site is my long-term engineering notebook and public portfolio. I focus on practical systems that must keep running under real business pressure.

          - **Backend Engineering**: Java, Spring, API design, data validation, and production debugging.
          - **Logistics Systems**: WMS, TMS, YMS, billing, carrier workflows, and SAP/ERP integration.
          - **DevOps Operations**: Linux, Nginx, Docker, VPS deployment, HTTPS, and incident recovery.
          - **Open Source**: Building Repo2AI to convert repositories into AI-ready context packs.
          - **AI Workflow**: Using ChatGPT/Codex as an engineering multiplier, not as a replacement for ownership.
        skills:
          enable: true
          title: "Core Stack"
          items:
            - "Java / Spring / REST APIs"
            - "MySQL / SQL troubleshooting"
            - "Linux / Nginx / HTTPS"
            - "Docker / GitHub Actions"
            - "WMS / TMS / SAP integration"
            - "AI-assisted development"

      projects:
        enable: true
        id: "projects"
        title: "Current Work"
        items:
          - title: "VPS and Nginx Recovery"
            content: "Documented the path from ERR_CONNECTION_REFUSED to a working HTTPS Hugo deployment on fichil.com."
            image: "/images/projects/default.png"
            featured:
              name: "Read Case"
              link: "/blog/fix-vps-connection/"
            badges: ["Nginx", "Linux", "HTTPS"]
          - title: "Repo2AI"
            content: "An open-source CLI that converts repositories into structured AI-ready context packs for ChatGPT, Claude, Cursor, and coding agents."
            image: "/images/projects/default.png"
            featured:
              name: "GitHub"
              link: "https://github.com/fichil/Repo2AI"
            badges: ["Go", "AI Tools", "Open Source"]
          - title: "Enterprise Logistics Integrations"
            content: "Engineering notes from WMS/TMS/YMS, carrier dispatch, billing, and SAP/ERP integration troubleshooting."
            image: "/images/projects/default.png"
            featured:
              name: "Contact"
              link: "#contact"
            badges: ["Java", "SAP", "WMS"]

      contact:
        enable: true
        id: "contact"
        title: "Contact"
        content: "For collaboration, technical discussions, or open-source feedback, send me a clear problem statement, logs, screenshots, or repository link."
        btnName: "Send Email"
        btnLink: "mailto:fichilzhang@gmail.com"

  # ================= 中文版配置 =================
  zh-cn:
    languageName: "中文"
    languageCode: "zh-CN"
    weight: 2
    title: "Fichil | 后端、运维与企业集成工程师"
    menus:
      main:
        - identifier: "about"
          name: "服务方向"
          url: "#about"
          weight: 1
        - identifier: "projects"
          name: "排障案例"
          url: "#projects"
          weight: 2
        - identifier: "blog"
          name: "技术博客"
          url: "/zh-cn/blog"
          weight: 3
        - identifier: "contact"
          name: "立即联系"
          url: "#contact"
          weight: 4
    params:
      description: "记录 Java 后端、物流系统、DevOps 运维、开源工具和 AI 辅助开发实践。"
      favicon: "/favicon.svg"
      hero:
        enable: true
        intro: "构建、排障、交付"
        title: "我是 Fichil"
        subtitle: "后端 / DevOps / 企业系统集成工程师"
        content: "这里记录我在 Java 后端、物流业务系统、Linux/Nginx 运维、SAP/WMS/TMS 集成，以及 AI 辅助开发上的长期实践。"
        image: "/images/profile.png"
        button:
          enable: true
          name: "阅读技术记录"
          url: "/zh-cn/blog/"

      about:
        enable: true
        id: "about"
        title: "工程方向"
        content: |-
          这个网站不是简历模板，而是我的长期工程记录。重点放在能落地、能复盘、能持续交付的技术实践。

          - **后端开发**：Java、Spring、接口设计、业务校验、生产问题定位。
          - **物流系统**：WMS、TMS、YMS、费用、承运商、调度、SAP/ERP 集成。
          - **运维部署**：Linux、Nginx、Docker、VPS、HTTPS、GitHub Actions。
          - **开源项目**：维护 Repo2AI，把代码仓库转换成适合 AI 阅读的上下文包。
          - **AI 工作流**：用 ChatGPT/Codex 提升开发效率，但保留工程师对质量和交付的最终责任。
        skills:
          enable: true
          title: "核心技术栈"
          items:
            - "Java / Spring / REST API"
            - "MySQL / SQL 排障"
            - "Linux / Nginx / HTTPS"
            - "Docker / GitHub Actions"
            - "WMS / TMS / SAP 集成"
            - "AI 辅助开发"

      projects:
        enable: true
        id: "projects"
        title: "当前重点"
        items:
          - title: "VPS 与 Nginx 恢复"
            content: "记录 fichil.com 从 ERR_CONNECTION_REFUSED 到 Hugo + HTTPS 正常访问的排障过程。"
            image: "/images/projects/default.png"
            featured:
              name: "查看案例"
              link: "/zh-cn/blog/fix-vps-connection/"
            badges: ["Nginx", "Linux", "HTTPS"]
          - title: "Repo2AI"
            content: "一个开源 CLI 工具，用于把代码仓库转换成适合 ChatGPT、Claude、Cursor 和 coding agent 阅读的上下文包。"
            image: "/images/projects/default.png"
            featured:
              name: "GitHub"
              link: "https://github.com/fichil/Repo2AI"
            badges: ["Go", "AI 工具", "开源"]
          - title: "企业物流系统集成"
            content: "持续整理 WMS/TMS/YMS、承运商调度、费用、计费、SAP/ERP 接口联调相关工程记录。"
            image: "/images/projects/default.png"
            featured:
              name: "联系我"
              link: "#contact"
            badges: ["Java", "SAP", "WMS"]

      contact:
        enable: true
        id: "contact"
        title: "联系我"
        content: "如果你想交流技术问题、开源项目或工程协作，请把问题背景、日志、截图或仓库链接整理后发给我。"
        btnName: "立即发邮件"
        btnLink: "mailto:fichilzhang@gmail.com"

# ================= 全局页脚配置 =================
footer:
  recentPosts:
    path: "blog"
    count: 3
    title: "Recent Posts"
    enable: true
  socialNetworks:
    github: "https://github.com/fichil"
    email: "mailto:fichilzhang@gmail.com"
