name: Deploy Hugo Site

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.1'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22222 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          rsync -avz --delete --delete-excluded --exclude "fontawesome-6/" --exclude "bootstrap-5/css/*.map" --exclude "bootstrap-5/js/*.map" --exclude "bootstrap-5/js/bootstrap.bundle.js" -e "ssh -p 22222 -i ~/.ssh/deploy_key" public/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET_DIR }}/

      - name: Smoke check
        run: |
          set -e
          for path in / /zh-cn/ /blog/ /zh-cn/blog/; do
            curl -fsS --retry 3 --retry-delay 5 "https://fichil.com${path}" > /dev/null
          done
