name: Site Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate automated blog pull request scope
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt'
        env:
          BLOG_AUTOMATION_MARKER: ${{ contains(github.event.pull_request.body, '<!-- codex-workday-bilingual-blog -->') }}
          BLOG_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tools/check-blog-pr-scope.sh

      - name: Test content QA approval gate
        run: bash tools/tests/check-content-qa-approval.test.sh

      - name: Validate content QA approval
        if: github.event_name == 'pull_request'
        env:
          CONTENT_QA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTENT_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONTENT_QA_PR_BODY: ${{ github.event.pull_request.body }}
          CONTENT_QA_PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: bash tools/check-content-qa-approval.sh

      - name: Validate Bandwagon mirror tooling
        run: bash deploy/bandwagon/tests/run.sh

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.1'
          extended: true

      - name: Build
        run: hugo --minify

  sites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: sites/package-lock.json

      - name: Install
        working-directory: sites
        run: npm ci

      - name: Audit Sites dependencies
        working-directory: sites
        run: npm run security:audit

      - name: Lint Sites application
        working-directory: sites
        run: npm run lint

      - name: Build and test Sites application
        working-directory: sites
        run: npm test
